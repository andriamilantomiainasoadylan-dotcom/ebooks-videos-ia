\">L’Ebook 1 t’explique la méthode et chaque étape de ta première vidéo.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 20px; background: #FFFFFF; border-radius: 12px\"><div style=\"font-weight: 700; color: #5B3FD1\">2 · Tu copies<\u002Fdiv><div style=\"color: #4A4560\">L’Ebook 2 te donne le modèle de prompt prêt à remplir pour chaque scène.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 20px; background: #FFFFFF; border-radius: 12px\"><div style=\"font-weight: 700; color: #5B3FD1\">3 · Tu génères<\u002Fdiv><div style=\"color: #4A4560\">Tu lances ta vidéo, tu corriges avec le dépannage, puis tu proposes tes services.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 24px 0 0; color: #4A4560\">Pour les débutants, étudiants et entrepreneurs. Aucune connaissance technique : un smartphone et une connexion internet suffisent pour démarrer.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width: 1040px; margin: 0 auto; padding: 56px 20px; box-sizing: border-box\">\n<h2 style=\"margin: 0 0 8px; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px\">Comment payer par mobile money<\u002Fh2>\n<p style=\"margin: 0 0 24px; color: #4A4560\">Trois étapes simples, sans carte bancaire.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 24px\">\n<div style=\"padding: 20px; background: #F4F1FE; border-radius: 12px\"><div style=\"font-weight: 700; color: #5B3FD1\">Étape 1<\u002Fdiv><div>Envoie 20 000 Ar par Airtel Money au numéro ci-dessous.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 20px; background: #F4F1FE; border-radius: 12px\"><div style=\"font-weight: 700; color: #5B3FD1\">Étape 2<\u002Fdiv><div>Envoie la capture d’écran ou la référence de la transaction sur WhatsApp.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 20px; background: #F4F1FE; border-radius: 12px\"><div style=\"font-weight: 700; color: #5B3FD1\">Étape 3<\u002Fdiv><div>Reçois tes 2 ebooks en PDF dès que le paiement est vérifié.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 24px; border: 2px solid #D9D0F7; border-radius: 16px; display: flex; flex-direction: column; gap: 4px\">\n<div style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #5B3FD1\">AIRTEL MONEY<\u002Fdiv>\n<div style=\"font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 700\">+261 33 94 574 12<\u002Fdiv>\n<div style=\"color: #4A4560\">Nom du bénéficiaire : Ainasoa Dylan<\u002Fdiv>\n<div style=\"color: #4A4560\">Montant : 20 000 Ar pour les 2 ebooks<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background: #F4F1FE\">\n<div style=\"max-width: 1040px; margin: 0 auto; padding: 56px 20px; box-sizing: border-box\">\n<h2 style=\"margin: 0 0 24px; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px\">Questions fréquentes<\u002Fh2>\n<h3 style=\"margin: 0 0 4px; font-size: 18px\">Quand vais-je recevoir les ebooks ?<\u002Fh3>\n<p style=\"margin: 0 0 20px; color: #4A4560\">Après vérification de ton paiement, les deux PDF te sont envoyés sur WhatsApp.<\u002Fp>\n<h3 style=\"margin: 0 0 4px; font-size: 18px\">Puis-je les lire sur mon téléphone ?<\u002Fh3>\n<p style=\"margin: 0 0 20px; color: #4A4560\">Oui. Ce sont des PDF qui se lisent sur téléphone, tablette ou ordinateur.<\u002Fp>\n<h3 style=\"margin: 0 0 4px; font-size: 18px\">Les outils d’IA sont-ils gratuits ?<\u002Fh3>\n<p style=\"margin: 0 0 20px; color: #4A4560\">Les ebooks t’apprennent à commencer avec les crédits gratuits. Certains outils sont payants ou limités, et leurs offres changent souvent.<\u002Fp>\n<h3 style=\"margin: 0 0 4px; font-size: 18px\">Vais-je gagner de l’argent ?<\u002Fh3>\n<p style=\"margin: 0; color: #4A4560\">Les ebooks expliquent une méthode pour proposer tes services. Les résultats dépendent de ta pratique et de tes efforts, aucun revenu n’est garanti.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background: #5B3FD1; color: #FFFFFF\">\n<div style=\"max-width: 1040px; margin: 0 auto; padding: 56px 20px; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px\">\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 32px\">Prêt à créer ta première vidéo ?<\u002Fh2>\n<div style=\"font-size: 20px\">20 000 Ar · 2 ebooks PDF livrés sur WhatsApp<\u002Fdiv>\n<a href=\"https://wa.me/261339457412?text=Bonjour%2C%20je%20veux%20commander%20le%20pack%20des%202%20ebooks%20%2820%20000%20Ar%29\" style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; background: #FFFFFF; color: #3D2A9E; font-weight: 700; text-decoration: none; border-radius: 12px\">Commander sur WhatsApp<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width: 1040px; margin: 0 auto; padding: 24px 20px; box-sizing: border-box; font-size: 14px; color: #4A4560; text-align: center\">© Ainasoa Dylan · Contenu éducatif, les résultats dépendent de ta pratique et des outils utilisés.<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#5B3FD1&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:3100}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn { accent: this.props.accent ?? '#5B3FD1' };\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
